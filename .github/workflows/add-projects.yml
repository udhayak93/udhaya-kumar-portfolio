name: Add Portfolio Projects

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  add-projects:
    if: ${{ !contains(github.event.head_commit.message, 'Update portfolio project section') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout portfolio
        uses: actions/checkout@v4

      - name: Add CineGo and Todo projects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          if 'CineGo – Movie Ticket Booking' in html:
              print('Projects already added. Nothing to change.')
              raise SystemExit(0)

          cards = r'''

            <!-- PROJECT 5 - CINEGO -->
            <div class="col-12 col-md-6 col-lg-4 project_col mb-4">
                <div class="modern_project_card">
                    <div class="project_image">
                        <img src="https://raw.githubusercontent.com/udhayak93/CineGo-Movie-Ticket-Booking-Website/main/Assets/Theater_01.png"
                            alt="CineGo Movie Ticket Booking Website">
                        <div class="project_overlay">
                            <a href="https://udhayak93.github.io/CineGo-Movie-Ticket-Booking-Website/" target="_blank" rel="noopener noreferrer" class="project_btn">
                                <i class="fa-solid fa-globe"></i> Live Demo
                            </a>
                            <a href="https://github.com/udhayak93/CineGo-Movie-Ticket-Booking-Website" target="_blank" rel="noopener noreferrer" class="project_btn outline_btn">
                                <i class="fa-brands fa-github"></i> Github
                            </a>
                        </div>
                    </div>
                    <div class="project_content">
                        <div class="project_tags">
                            <span>HTML5</span>
                            <span>CSS3</span>
                            <span>JavaScript</span>
                            <span>Bootstrap</span>
                            <span>UI/UX</span>
                        </div>
                        <h3>CineGo – Movie Ticket Booking</h3>
                        <p>
                            Responsive movie ticket booking website with movie discovery, search and filters,
                            booking flow, theatre selection, offers, authentication, and interactive UI components.
                        </p>
                    </div>
                </div>
            </div>

            <!-- PROJECT 6 - TODO LIST -->
            <div class="col-12 col-md-6 col-lg-4 project_col mb-4">
                <div class="modern_project_card">
                    <div class="project_image">
                        <img src="https://images.unsplash.com/photo-1484480974693-6ca0a78fb36b?q=80&w=1200&auto=format&fit=crop"
                            alt="Todo List App">
                        <div class="project_overlay">
                            <a href="https://github.com/udhayak93/Todo_App" target="_blank" rel="noopener noreferrer" class="project_btn">
                                <i class="fa-brands fa-github"></i> Github
                            </a>
                        </div>
                    </div>
                    <div class="project_content">
                        <div class="project_tags">
                            <span>React.js</span>
                            <span>Node.js</span>
                            <span>Express.js</span>
                            <span>MongoDB</span>
                            <span>REST API</span>
                        </div>
                        <h3>Todo List App</h3>
                        <p>
                            Full-stack MERN task management application with add, edit, delete,
                            completion tracking, MongoDB persistence, and REST API integration.
                        </p>
                    </div>
                </div>
            </div>
          '''

          pattern = r'(<section class="row projects_section py-5" id="projects">.*?)(\n\s*</section>)'
          match = re.search(pattern, html, flags=re.S)
          if not match:
              raise SystemExit('Projects section not found.')

          updated = match.group(1) + cards + match.group(2)
          html = html[:match.start()] + updated + html[match.end():]
          path.write_text(html, encoding='utf-8')
          print('CineGo and Todo projects added successfully.')
          PY

      - name: Commit portfolio update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Update portfolio project section"
          git push
